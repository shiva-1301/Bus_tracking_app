# Render Blueprint: one web service serves both the API and the built Angular app.
services:
  - type: web
    name: smartbus-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/reviews
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.18.0"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # e.g. https://smartbus-tracker.onrender.com
